; viperport settings. The engine-limit fixes are always on. viperport.exe always uses the modern
; platform (SDL, OpenGL, SDL audio); these lines are what race.exe / race.bin use with dinput.dll.
[platform]
; 1 = SDL2 window, keyboard, mouse and game controllers; 0 = the game's own
sdl=1
; gl = OpenGL in place of DirectDraw/Direct3D (needs sdl=1); ddraw = the game's own
renderer=gl
; sdl = SDL audio in place of DirectSound (needs sdl=1); dsound = the game's own
audio=sdl

[graphics]
; anisotropic texture filtering: 0 (off, as the original), 2, 4, 8 or 16 -- sharper distant textures where the
; game filters them (switch on "filtering" and "mipmap" in the game's Graphics options)
anisotropic=0
; anti-aliasing of the 3D (MSAA): 0 (off, as the original), 2, 4 or 8 -- smoother edges; takes effect at the next start
msaa=0
